<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Cuerpo -->
  <g id="zone-body">
    <path id="torso" d="M85 100 L85 260 L215 260 L215 100 Q175 95 150 95 Q125 95 85 100 Z" fill="#cccccc"/>
    <rect id="hem" x="85" y="252" width="130" height="10" rx="2" fill="#cccccc"/>
  </g>

  <!-- Mangas -->
  <g id="zone-sleeves">
    <!-- Manga izquierda -->
    <path id="sleeve-left" d="M85 100 Q60 95 40 110 L40 165 L75 160 L85 140 Z" fill="#aaaaaa"/>
    <rect id="cuff-left" x="38" y="158" width="38" height="9" rx="2" fill="#aaaaaa"/>
    <!-- Manga derecha -->
    <path id="sleeve-right" d="M215 100 Q240 95 260 110 L260 165 L225 160 L215 140 Z" fill="#aaaaaa"/>
    <rect id="cuff-right" x="224" y="158" width="38" height="9" rx="2" fill="#aaaaaa"/>
  </g>

  <!-- Cuello -->
  <g id="zone-hood">
    <!-- No tiene capucha, cuello redondo -->
    <ellipse id="neckline" cx="150" cy="95" rx="35" ry="15" fill="#bbbbbb"/>
    <path id="neck-inner" d="M120 95 Q150 85 180 95 Q175 100 150 100 Q125 100 120 95 Z" fill="#cccccc" fill-opacity="0.4"/>
  </g>

  <!-- Detalles -->
  <g id="zone-details" stroke="#00000025" stroke-width="1.5" fill="none">
    <line x1="87" y1="105" x2="87" y2="258"/>
    <line x1="213" y1="105" x2="213" y2="258"/>
    <line x1="150" y1="100" x2="150" y2="260" stroke-dasharray="4 4"/>
  </g>

  <text id="text-front" x="150" y="175" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#00000060" font-weight="600">TEXTO</text>
  <text id="text-secondary" x="150" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#00000040">2025</text>
</svg>
