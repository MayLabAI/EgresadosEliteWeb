<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" fill="none">
  <!-- Cuerpo con recorte en el frente (sin bolsillo, panel V) -->
  <g id="zone-body">
    <rect id="torso" x="70" y="110" width="160" height="160" rx="4" fill="#cccccc"/>
    <!-- Panel recorte V en el pecho -->
    <path id="panel-v" d="M110 112 L150 160 L190 112 Z" fill="#cccccc" fill-opacity="0.7"/>
    <rect id="hem" x="70" y="260" width="160" height="10" rx="2" fill="#cccccc"/>
  </g>

  <!-- Mangas -->
  <g id="zone-sleeves">
    <path id="sleeve-left" d="M70 120 L30 145 L30 230 L50 230 L70 200 Z" fill="#aaaaaa"/>
    <rect id="cuff-left" x="28" y="225" width="24" height="10" rx="2" fill="#aaaaaa"/>
    <path id="sleeve-right" d="M230 120 L270 145 L270 230 L250 230 L230 200 Z" fill="#aaaaaa"/>
    <rect id="cuff-right" x="248" y="225" width="24" height="10" rx="2" fill="#aaaaaa"/>
    <!-- Rayas -->
    <line x1="38" y1="175" x2="68" y2="167" stroke="#00000022" stroke-width="3"/>
    <line x1="38" y1="185" x2="68" y2="178" stroke="#00000022" stroke-width="3"/>
    <line x1="262" y1="175" x2="232" y2="167" stroke="#00000022" stroke-width="3"/>
    <line x1="262" y1="185" x2="232" y2="178" stroke="#00000022" stroke-width="3"/>
  </g>

  <!-- Capucha -->
  <g id="zone-hood">
    <path id="hood" d="M85 115 Q85 50 150 45 Q215 50 215 115 Q195 108 150 108 Q105 108 85 115 Z" fill="#bbbbbb"/>
    <path id="hood-inner" d="M100 112 Q100 65 150 60 Q200 65 200 112 Q180 106 150 106 Q120 106 100 112 Z" fill="#cccccc" fill-opacity="0.3"/>
    <line x1="130" y1="112" x2="120" y2="140" stroke="#00000040" stroke-width="2"/>
    <line x1="170" y1="112" x2="180" y2="140" stroke="#00000040" stroke-width="2"/>
    <circle cx="119" cy="141" r="4" fill="#00000050"/>
    <circle cx="181" cy="141" r="4" fill="#00000050"/>
  </g>

  <!-- Detalles: recorte V y costuras -->
  <g id="zone-details" fill="none">
    <path d="M108 112 L150 162 L192 112" stroke="#00000035" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="72" y1="120" x2="72" y2="268" stroke="#00000025" stroke-width="1.5"/>
    <line x1="228" y1="120" x2="228" y2="268" stroke="#00000025" stroke-width="1.5"/>
    <line x1="150" y1="110" x2="150" y2="270" stroke="#00000020" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <text id="text-front" x="150" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#00000060" font-weight="600">TEXTO</text>
  <text id="text-secondary" x="150" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#00000040">2025</text>
</svg>
